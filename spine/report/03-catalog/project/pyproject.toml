[project]
name = "book-shop"
version = "1.1.0"
description = "An online book shop on AWS"
requires-python = ">=3.13"
dependencies = ["boto3==1.43.117"]

[dependency-groups]
dev = ["pytest==9.1.1", "moto[s3]==5.2.5"]
# The nightly jobs (jobs/): read the orders database, write Parquet to the lake.
jobs = ["psycopg[binary]==3.3.6", "pyarrow==26.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
